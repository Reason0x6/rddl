services:
  rd-downloader:
    build: .
    container_name: rd-downloader
    restart: unless-stopped
    environment:
      REAL_DEBRID_TOKEN: ${REAL_DEBRID_TOKEN:-}
      TORBOX_API_KEY: ${TORBOX_API_KEY:-}
      APP_USERNAME: ${APP_USERNAME:-admin}
      APP_PASSWORD: ${APP_PASSWORD:-}
      SESSION_SECRET: ${SESSION_SECRET:-}
      AUTH_COOKIE_SECURE: ${AUTH_COOKIE_SECURE:-0}
      DOWNLOAD_ROOT: /media
      DATA_DIR: /data
      POLL_SECONDS: "10"
      PORT: "8080"
      # Set this to your configured Torrentio endpoint.
      # Example: https://torrentio.strem.fun/<your-config>
      TORRENTIO_URL: ${TORRENTIO_URL:-}
    ports:
      - "8080:8080"
    volumes:
      - /media:/media
      - ./data:/data
