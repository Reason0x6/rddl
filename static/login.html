<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#08090b">
<title>Sign in · RD Media Downloader</title>
<style>
:root{color-scheme:light;--ink:#18221e;--muted:#69756f;--green:#177b56;--green-dark:#116344;--line:#e3e8e3;--paper:#fff;--canvas:#f4f5f2}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:20px;background:radial-gradient(ellipse at 78% -15%,#dceee2 0,transparent 38%),var(--canvas);color:var(--ink);font:15px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}.card{width:min(420px,100%);padding:30px;border:1px solid #e7ebe6;border-radius:20px;background:#fffffff2;box-shadow:0 16px 40px #1c302512}.brand{margin-bottom:25px;color:var(--green);font-size:13px;font-weight:750;letter-spacing:.12em;text-transform:uppercase}h1{margin:0;font-size:30px;letter-spacing:-.04em}p{margin:7px 0 22px;color:var(--muted)}label{display:block;margin-top:14px;color:#48554e;font-size:13px;font-weight:650}input{display:block;width:100%;height:46px;margin-top:7px;padding:0 13px;border:1px solid #d8dfd9;border-radius:10px;outline:none;color:var(--ink);background:white;font:inherit}input:focus{border-color:#60a483;box-shadow:0 0 0 3px #177b561a}button{width:100%;height:46px;margin-top:21px;border:0;border-radius:10px;color:white;background:var(--green);font:inherit;font-weight:700;cursor:pointer}button:hover{background:var(--green-dark)}button:disabled{opacity:.65;cursor:wait}.error{min-height:22px;margin-top:13px;color:#a3342b;font-size:13px}
</style>
<style>
:root{color-scheme:dark;--ink:#f1f0ed;--muted:#999a9b;--green:#ff792f;--green-dark:#ff984f;--line:#28292b;--paper:#111214;--canvas:#08090b}body{position:relative;isolation:isolate;overflow:hidden;background:radial-gradient(ellipse at 78% 47%,#3b1a0d42,transparent 37%),radial-gradient(ellipse at 20% 10%,#14202a35,transparent 35%),#08090b;color:var(--ink);font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}body:before{position:fixed;z-index:-1;top:50%;left:50%;width:min(76vw,820px);height:min(76vw,820px);border:1px solid #ff93501c;border-radius:31% 69% 57% 43%/47% 39% 61% 53%;content:"";transform:translate(-13%,-50%) rotate(-24deg);background:linear-gradient(140deg,#ffad6533,#ed4a171a 44%,transparent 75%),repeating-linear-gradient(48deg,transparent 0 27px,#ffb07a0a 28px 29px);box-shadow:0 0 120px #ed541621,inset 0 0 60px #ff844312}body:after{position:fixed;z-index:-1;inset:0;content:"";pointer-events:none;background-image:radial-gradient(#ffffffab .65px,transparent .8px),radial-gradient(#ff8b4cbd .7px,transparent .9px);background-position:0 0,37px 61px;background-size:91px 91px,147px 147px;opacity:.12;mask-image:linear-gradient(to bottom,#000,transparent 88%)}.card{border:1px solid #ffffff20;border-radius:20px;color:var(--ink);background:linear-gradient(145deg,#151618f5,#0e0f11f5);box-shadow:0 30px 90px #000a;backdrop-filter:blur(14px)}.brand{color:#ff9958;letter-spacing:.18em}.brand:before{display:inline-grid;place-items:center;width:31px;height:31px;margin-right:9px;border:1px solid #ff8a454d;border-radius:50%;content:"▶";font-size:10px;vertical-align:middle;box-shadow:0 0 24px #ff792f20}h1{font-size:34px;font-weight:570;letter-spacing:-.055em}p{color:#a5a4a2}label{color:#c4c1bd}input{border-color:#ffffff20;border-radius:9px;color:#f0eeeb;background:#090a0c}input:focus{border-color:#ff8744;box-shadow:0 0 0 3px #ff792f24}button{border:1px solid #ffffff40;border-radius:99px;color:#fff;background:#ffffff05;font-size:13px}button:hover{border-color:#ff8a45;color:#ffad77;background:#ff792f12}.error{color:#ff9b84}@media(max-width:600px){body:before{left:30%;width:110vw;height:110vw;transform:translate(-10%,-52%) rotate(-24deg);opacity:.55}.card{padding:25px}}
</style>
</head>
<body>
<form class="card" id="login-form">
  <div class="brand">RD Media Downloader</div>
  <h1>Welcome back</h1>
  <p>Sign in to browse, request, and download media.</p>
  <label>Username<input id="username" name="username" autocomplete="username" required></label>
  <label>Password<input id="password" name="password" type="password" autocomplete="current-password" required></label>
  <button id="submit" type="submit">Sign in</button>
  <div class="error" id="error" role="alert" aria-live="polite"></div>
</form>
<script>
const form = document.getElementById('login-form');
form.addEventListener('submit', async event => {
  event.preventDefault();
  const button = document.getElementById('submit');
  const error = document.getElementById('error');
  button.disabled = true;
  button.textContent = 'Signing in…';
  error.textContent = '';
  try {
    const response = await fetch('/api/login', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({
        username: document.getElementById('username').value,
        password: document.getElementById('password').value,
      }),
    });
    const result = await response.json();
    if (!response.ok) throw new Error(result.detail || 'Sign in failed');
    location.replace('/app');
  } catch (exception) {
    error.textContent = exception.message || 'Could not sign in';
    button.disabled = false;
    button.textContent = 'Sign in';
  }
});
</script>
</body>
</html>
